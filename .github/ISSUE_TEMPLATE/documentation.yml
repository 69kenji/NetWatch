name: Documentation issue
description: Report unclear, missing, or incorrect public documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: textarea
    id: location
    attributes:
      label: Documentation location
      description: Name the file/section or setup step that needs attention.
      placeholder: "README.md — VPN/WireGuard setup"
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What is unclear or incorrect?
      description: Describe what you expected the documentation to explain.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested clarification
      description: Optional wording or additional context that would have helped.

  - type: checkboxes
    id: secrets
    attributes:
      label: Privacy check
      options:
        - label: I have not included API keys, VPN private keys/configuration, tokens, or other secrets.
          required: true
